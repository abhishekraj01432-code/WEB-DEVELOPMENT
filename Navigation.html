<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Menu</title>
    <style>
    body {
      font-family: Arial, sans-serif;
    }
    .navbar {
      background-color: #333;
      overflow: hidden;
    }
    .navbar a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
    }
    .navbar a:hover {
      background-color: #575757;
    }
    .navbar input[type="text"] {
      float: left;
      padding: 6px;
      margin: 10px 5px;
      border: none;
      border-radius: 4px;
    }
    .navbar button {
      float: left;
      padding: 8px 14px;
      margin: 10px 5px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .navbar button:hover {
      background-color: #8e0303;
    }
  </style>
</head>
<body>
    <div class="navbar">
  <a href="#home">Home</a>
  <a href="#about">About</a>
  <a href="#contact">Contact</a>
  <input type="text" placeholder="Search...">
  <button>Button</button>
</div>
</body>
</html>
